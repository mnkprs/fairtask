name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: typecheck · verifier tests · scorer on committed results
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The scorer needs only the committed predictions and human labels — no API key, no clones.
      - run: node src/score.ts baseline baseline-rerun v1-context v2-specialists v3-verify v4-calibrated v5-cheap-probes v5-rerun v6-target-aware v7-sonnet-nocal
      - name: committed annotations match the pinned public source
        run: |
          node src/data/fetch-annotations.ts --check
          cp data/raw/ensembled_annotations_public.csv /tmp/committed.csv
          node src/data/fetch-annotations.ts
          cmp /tmp/committed.csv data/raw/ensembled_annotations_public.csv
      - name: committed data artifacts are exactly reproducible
        # The dataset is fetched at a pinned revision; both builders are re-run and the WHOLE artifacts must be
        # byte-identical to what is committed (not just the sampled ids).
        run: |
          curl --fail -sL -o data/raw/swebench_test.parquet "https://huggingface.co/datasets/princeton-nlp/SWE-bench/resolve/e48e2bd1e9fecd5bbd641e9414ac59da9f2e69f6/data/test-00000-of-00001.parquet"
          npm run data:eval-set > /dev/null
          npm run data:calibration > /dev/null
          git diff --exit-code -- data/eval/instances.json data/eval/calibration.json
      - name: plugin manifests are semantically valid and describe one skill
        run: |
          npm run validate:manifests
          npx --yes @anthropic-ai/claude-code@2.1.250 --plugin-dir . plugin details fairtask | grep -E "Skills \(2\)"
          npx --yes skills add . --list 2>&1 | grep -q "fairtask"
